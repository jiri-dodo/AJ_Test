<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angličtina pro samouky – trenér</title>
<style>
  :root{
    --bg: #16302b; --bg-alt: #1e3f38; --card: #f7f2e4; --card-line: #e2d8bf;
    --ink: #232019; --ink-soft: #5c574a; --accent: #bb4a2c; --accent-ink: #ffffff;
    --gold: #d9a441; --good: #3f7d58; --bad: #b3432b;
    --serif: Georgia, "Iowan Old Style", serif;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Consolas", "Menlo", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(circle at 15% 10%, var(--bg-alt), transparent 55%), var(--bg);
    color:var(--ink); font-family:var(--sans); min-height:100vh; padding:24px 14px 60px;}
  .wrap{max-width:720px;margin:0 auto;}
  header.top{color:#f3ede0;margin-bottom:16px;}
  header.top h1{font-family:var(--serif);font-size:26px;margin:0 0 4px;}
  header.top .ai-note{font-size:12px;color:#cfd8c9;margin:0 0 12px;}
  .lesson-select{width:100%;padding:12px 14px;border-radius:10px;border:none;background:var(--card);
    color:var(--ink);font-size:15px;font-family:var(--sans);margin-bottom:12px;font-weight:600;}
  .lesson-meta{color:#c9cabb;font-size:13px;margin:0 0 14px;}
  nav.tabs{display:flex;gap:5px;margin-bottom:14px;background:var(--bg-alt);padding:5px;border-radius:10px;flex-wrap:wrap;}
  nav.tabs button{flex:1 1 auto;white-space:nowrap;padding:9px 8px;border:none;border-radius:7px;background:transparent;
    color:#cfd8c9;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;}
  nav.tabs button.active{background:var(--card);color:var(--ink);}
  .card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.28);border:1px solid var(--card-line);}
  h2.section-title{font-family:var(--serif);font-size:20px;margin:0 0 4px;}
  h3.sub-title{font-family:var(--serif);font-size:16px;margin:18px 0 6px;color:var(--ink);}
  p.section-desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;line-height:1.45;}
  .quiz-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-family:var(--mono);}
  .prompt-word{font-family:var(--serif);font-size:26px;line-height:1.15;margin:6px 0 2px;}
  .prompt-ipa{font-family:var(--mono);color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  @media (max-width:480px){.options{grid-template-columns:1fr;}}
  .opt-btn{text-align:left;padding:12px 13px;border-radius:9px;border:1.5px solid #d9cfae;background:#fffdf7;
    font-family:var(--sans);font-size:14.5px;color:var(--ink);cursor:pointer;}
  .opt-btn:hover{border-color:var(--accent);}
  .opt-btn.correct{background:#e4f1e8;border-color:var(--good);color:#1e4a30;}
  .opt-btn.wrong{background:#fbe7e1;border-color:var(--bad);color:#7a2a17;}
  .opt-btn[disabled]{cursor:default;}
  .feedback-row{margin-top:14px;display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:10px;}
  .feedback-text{font-size:13.5px;font-weight:600;}
  .feedback-text.correct{color:var(--good);}
  .feedback-text.wrong{color:var(--bad);}
  button.primary{background:var(--accent);color:var(--accent-ink);border:none;padding:10px 18px;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap;}
  button.primary:disabled{opacity:.4;cursor:default;}
  button.secondary{background:transparent;color:var(--ink);border:1.5px solid #cabf9c;padding:8px 15px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .setup-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .toggle-group{display:flex;border:1.5px solid #cabf9c;border-radius:8px;overflow:hidden;}
  .toggle-group button{padding:8px 12px;border:none;background:#fffdf7;font-size:13px;cursor:pointer;font-family:var(--sans);color:var(--ink-soft);}
  .toggle-group button.on{background:var(--ink);color:#fff;font-weight:700;}
  .summary-stats{display:flex;gap:14px;margin:12px 0 18px;}
  .stat{background:#fffdf7;border:1px solid var(--card-line);border-radius:10px;padding:12px 16px;flex:1;text-align:center;}
  .stat .num{font-family:var(--serif);font-size:24px;display:block;}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);}
  .missed-list{list-style:none;margin:0 0 18px;padding:0;}
  .missed-list li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--card-line);font-size:13.5px;gap:10px;}
  .missed-list li span.en{font-weight:700;}
  .missed-list li span.cz{color:var(--ink-soft);text-align:right;}
  .grammar-block{font-size:14px;line-height:1.6;}
  .grammar-block .topic-h{font-family:var(--serif);font-weight:700;font-size:15.5px;margin:16px 0 4px;color:var(--ink);}
  .grammar-block .topic-h:first-child{margin-top:0;}
  .grammar-block p{margin:2px 0 8px;}
  .phrase-list{list-style:none;margin:0;padding:0;}
  .phrase-list li{padding:8px 0;border-bottom:1px solid var(--card-line);font-size:13.5px;}
  .phrase-list li b{display:block;color:var(--ink);}
  .phrase-list li span{color:var(--ink-soft);}
  .revision-block{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--card-line);}
  .revision-block:last-child{border-bottom:none;}
  .revision-block h4{font-family:var(--serif);font-size:15px;margin:0 0 8px;}
  .revision-block pre{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.6;margin:0;color:var(--ink);}
  .reveal-btn{margin-top:10px;}
  .answer-box{margin-top:10px;padding:12px;background:#eef4ee;border-radius:8px;border:1px solid var(--good);display:none;}
  .answer-box.show{display:block;}
  .answer-box pre{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.6;margin:0;color:#1e4a30;}
  .history-list{list-style:none;margin:0;padding:0;}
  .history-list li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-line);font-size:13px;}
  .history-list .score-good{color:var(--good);font-weight:700;}
  .history-list .score-bad{color:var(--bad);font-weight:700;}
  .empty-state{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:20px 0;}
  .mode-switch{display:flex;gap:6px;margin-bottom:12px;}
  .mode-switch button{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid #3c5f56;background:transparent;color:#e7e2d3;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;}
  .mode-switch button.on{background:var(--gold);border-color:var(--gold);color:#1d1a12;}
  .zap-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
  .zap-list{list-style:none;margin:0;padding:0;}
  .zap-list li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--card-line);font-size:14px;line-height:1.4;}
  .zap-list li .en{font-weight:700;color:var(--ink);flex:1 1 50%;}
  .zap-list li .cz{color:var(--ink-soft);font-style:italic;flex:1 1 50%;text-align:right;}
  .zap-list.hide-cz li .cz{color:transparent;background:#e9e1c9;border-radius:5px;cursor:pointer;user-select:none;}
  .zap-list.hide-cz li .cz.shown{color:var(--ink-soft);background:transparent;}
  .zap-group-h{font-family:var(--serif);font-weight:700;font-size:15px;margin:18px 0 4px;}
  .fv-verb{font-family:var(--serif);font-weight:700;font-size:16px;margin:18px 0 2px;color:var(--accent);letter-spacing:.5px;}
  .fv-ex{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-style:normal;font-weight:400;}
  .fv-src{font-size:11px;color:#9a917a;font-weight:400;}
  .set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 18px;}
  .set-btn{text-align:left;padding:12px;border-radius:10px;border:1.5px solid #d9cfae;background:#fffdf7;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .set-btn:hover{border-color:var(--accent);}
  .set-btn b{display:block;font-size:14.5px;margin-bottom:3px;}
  .set-btn small{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.35;}
  .set-btn .best{display:block;margin-top:5px;font-size:11.5px;font-weight:700;}
  .gap-sentence{font-family:var(--serif);font-size:21px;line-height:1.35;margin:6px 0 4px;}
  .gap-sentence .gap{display:inline-block;min-width:60px;border-bottom:2px solid var(--accent);}
  .q-kind{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;margin-bottom:4px;}
  footer.foot{text-align:center;color:#a9b4a3;font-size:11.5px;margin-top:24px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Angličtina pro samouky – trenér</h1>
    <p class="ai-note">Vytvořeno pomocí umělé inteligence.</p>
  </header>

  <div class="mode-switch" id="modeSwitch">
    <button data-mode="lessons" class="on">Lekce</button>
    <button data-mode="fv">Frázová slovesa</button>
  </div>

  <div id="lessonChrome">
  <select class="lesson-select" id="lessonSelect"></select>
  <p class="lesson-meta" id="lessonMeta"></p>

  <nav class="tabs">
    <button data-tab="vocab" class="active">Slovíčka</button>
    <button data-tab="zap">Zapamatujte si</button>
    <button data-tab="phrases">Vazby</button>
    <button data-tab="grammar">Gramatika</button>
    <button data-tab="test">Test</button>
  </nav>
  </div>

  <main class="card" id="mainCard"></main>

  <footer class="foot">Zdroj: Miloslava Pourová – Angličtina pro samouky.<br>Data extrahována a strojově vyčištěna z textu knihy; oddíly Zapamatujte si a frázová slovesa přečteny z obrázků stran (OCR) a zkontrolovány. Chyba se může vzácně objevit.</footer>
</div>

 zájmeno a předložku, je nutné dát zájmeno na","začátek věty a předložku na konec. (Who did you go there with? S kým jsi tam","šel?","PŘÍKLADY A PROCVIČOVÁNÍ GRAMATIKY","Where do you usually go? Kam obvykle chodíš?","Where did you travel? Kam jsi cestoval?","Where will they buy flowers?","(V budoucím čase není „do³.)","Kde si koupí květiny?","Why didn´t he sleep? Proč nespal?","Why were they in the corner of the","room? (U slovesa „být³ není „do³.)","Proč byli v rohu místnosti?","How does he speak English? Jak mluví anglicky?","How far did you study? Jak daleko jsi studoval?","How far is your housing estate? Jak daleko je vaše sídliště?","How long does the meeting take? Jak dlouho trvá schůze?","How long were you in Ireland? Jak dlouho jste byli v Irsku?","How often did he send invoices? Jak často posílal Iaktury?","How often will they write e-mails? Jak často budou psát e\u0010maily?","How many times a day does he drink","beer?","Kolikrát denně pije pivo?","Who drove your children to school?","(1. pád – není „do³)","Kdo odvezl tvé děti do školy?","Who did you meet? (4. pád – je „do³) Koho jste potkali?","Who left at noon? (1. pád – je „do³) Kdo odešel v poledne?","Who did you employ? (4. pád – není","„do³)","Koho jste zaměstnal?","Who will buy this dress? (V budoucím","čase není „do³.)","Kdo si koupí tyto šaty?","Who will you invite? Koho pozveš?","Who is it? Kdo je to?","Who was at the bookshop last Friday? Kdo byl minulý pátek v knihkupectví?","Who will be at the boutiTue tomorrow? Kdo bude zítra v butiku?","What did the assistant say? Co řekla prodavačka?","What goods does he buy? Jaké zboží kupuje?","Whose purchase is expensive? ýí nákup je drahý?","Whose skirt do you like? ýí sukně se ti líbí?","Whose car were you sitting in? V čím autě jsi seděl?","Which flight is late? Který let má zpoždění?","Which tram do you take? Number 6 or","8?","Kterou jezdíš tramvají? ýíslem \u0019 nebo","Which shop is yours? Který obchod je váš?","How much flour will you need? Kolik pít kávu \u000b chystáš se\f, než se","bude podávat večeře?","I´m going to study until my parents","come home. (Po „until³ není „not³.)","Budu se učit, dokud rodiče nepřijdou","domů.","I can´t tell him until I meet him. Nemohu mu to říct, dokud ho","nepotkám.","VYJADŘOVÁNÍ ČESKÉHO şABYŞ A şABY NEŞ","Spojkou „aby³ jsou v češtině uvozovány věty účelové. Òčelové věty, které mají","stejný podmět jako věta hlavní, se zkracují infnitivem s „to³ (v záporu „not to³).","We worked to earn a lot of money. Pracovali jsme, abychom si vydělali hodně","peněz. (V obou částech věty je stejný podmět „we³ a věta je kladná, proto se užije","„to³.)","We hurried not to be late. Spěchali jsme, abychom nepřišli pozdě. (V obou čás\u0002tech věty je stejný podmět „we³ a věta je záporná, proto se užije „not to³.)","U účelových vět, které nemají stejný podmět s větou hlavní, je nejjednodušší použít","infnitivní vazbu s předložkou „for³.","Teachers explain new English words for the children to understand the text.","Učitelé vysvětlují nová anglická slova, aby děti rozuměly te[tu. (Nestejné pod\u0002měty – „teachers³ a „children³, proto „for … to³)","PŘÍKLADY A PROCVIČENÍ GRAMATIKY","He came to give me some money. Přišel, aby mi dal nějaké peníze.","They are going to study English to","understand foreigners.","Chystají se učit anglicky, aby rozuměli","cizincům.","Take an umbrella not to get wet. Vezměte si deštník, abyste nezmokli.","Do it now not to have to think of it all","the time.","Udělej to nyní, abys na to nemusel stále","myslet.","I´ll work a lot to be able to buy a car. Budu hodně pracovat, abych si mohl","koupit auto.","I´ll leave home early not to miss the","bus.","Odejdu z domu brzy, abych nezmeškal","autobus.","Mother made a cake for her family not","to be hungry.","Matka udělala dort, aby její rodina","neměla hlad.","The teacher brought a lot of books for","her students to choose some.","Učitelka přinesla hodně knih, aby si její","studenti mohli nějaké vybrat.","The foreigner spok "up","cz":"zvednout se (opona)","src":"Lekce 21 – Zapamatujte si","ex":[{"en":"go up","cz":"zvednout se","blank":"up"}]},{"v":"pull","p":"out","cz":"vytrhnout","src":"Lekce 22 – Zapamatujte si","ex":[{"en":"pull the tooth out","cz":"vytrhnout zub","blank":"out"}]},{"v":"call","p":"for","cz":"vyzvednout (někoho, něco)","src":"Lekce 23 – Zapamatujte si","ex":[{"en":"call for them","cz":"vyzvednout je","blank":"for"}]},{"v":"set","p":"up","cz":"založit (si)","src":"Lekce 23 – Zapamatujte si","ex":[{"en":"set up an account","cz":"založit si účet","blank":"up"}]},{"v":"pay","p":"off","cz":"splatit","src":"Lekce 23 – Zapamatujte si","ex":[{"en":"pay off","cz":"splatit","blank":"off"}]},{"v":"fill","p":"in","cz":"vyplnit (formulář)","src":"Lekce 26 – Zapamatujte si","ex":[{"en":"fill in the form","cz":"vyplnit formulář","blank":"in"}]},{"v":"see","p":"off","cz":"vyprovodit (někoho)","src":"Lekce 26 – Zapamatujte si","ex":[{"en":"see somebody off","cz":"vyprovodit někoho","blank":"off"}]},{"v":"take","p":"on","cz":"přijmout (do zaměstnání)","src":"Lekce 27 – Zapamatujte si","ex":[{"en":"take on","cz":"přijmout","blank":"on"}]},{"v":"hear","p":"from","cz":"dostat zprávu od (někoho)","src":"Lekce 27 – Zapamatujte si","ex":[{"en":"hear from somebody","cz":"dostat od někoho zprávu","blank":"from"}]},{"v":"plug","p":"in","cz":"zapojit (do zásuvky)","src":"Lekce 28 – Zapamatujte si","ex":[{"en":"plug in the computer","cz":"zapojit počítač do zásuvky","blank":"in"}]}];
</script>
<script>
/* ============ STORAGE (published-page db capability, per-viewer private) ============ */
let _dbNS = null, _userDocRef = null;
const _storageInit = (async () => {
  try{
    const dbNS = await claude.use('db');
    const userNS = await claude.use('user');
    if(dbNS && userNS){
      const uid = await userNS.id();
      if(uid){ _dbNS = dbNS; _userDocRef = dbNS.doc(`data/users/${uid}/state`); }
    }
  }catch(e){ /* capability unavailable in this view */ }
  if(!_userDocRef){
    /* offline fallback (downloaded file, mobile): store in this browser's localStorage */
    try{
      const K='ajtrener-state'; localStorage.setItem(K+'-probe','1'); localStorage.removeItem(K+'-probe');
      _userDocRef = {
        get: async () => { const v = localStorage.getItem(K); return {exists: !!v, data: () => (v ? JSON.parse(v) : {})}; },
        set: async (d) => { localStorage.setItem(K, JSON.stringify(d)); }
      };
    }catch(e){ /* no storage available */ }
  }
})();
async function loadState(){
  await _storageInit;
  if(!_userDocRef) return {};
  try{ const snap = await _userDocRef.get(); return snap.exists ? (snap.data() || {}) : {}; }
  catch(e){ return {}; }
}
async function loadTestHistory(lessonNum){
  const state = await loadState();
  return (state.testHistory && state.testHistory[lessonNum]) || [];
}
async function appendTestHistory(lessonNum, entry){
  if(!_userDocRef) return;
  try{
    const snap = await _userDocRef.get();
    const data = snap.exists ? (snap.data() || {}) : {};
    if(!data.testHistory) data.testHistory = {};
    if(!data.testHistory[lessonNum]) data.testHistory[lessonNum] = [];
    data.testHistory[lessonNum].push(entry);
    await _userDocRef.set(data);
  }catch(e){ /* best-effort; quiz still works without saved history */ }
}

/* ============ STATE ============ */
let currentLessonNum = 1;
let activeTab = 'vocab';
const mainCard = document.getElementById('mainCard');
const lessonSelect = document.getElementById('lessonSelect');
const lessonMeta = document.getElementById('lessonMeta');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function primaryCz(cz){ return cz.split('/')[0].split(',')[0].trim(); }

function populateLessonSelect(){
  const nums = Object.keys(LESSONS).map(Number).sort((a,b)=>a-b);
  nums.forEach(n=>{
    const l = LESSONS[n];
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = `${n}. ${l.cz}${l.revision ? ' (opakování)' : ''}`;
    lessonSelect.appendChild(opt);
  });
  lessonSelect.value = currentLessonNum;
}
lessonSelect.addEventListener('change', ()=>{
  currentLessonNum = Number(lessonSelect.value);
  updateMeta();
  render();
});

function updateMeta(){
  const l = LESSONS[currentLessonNum];
  lessonMeta.textContent = l.revision
    ? `Opakovací lekce – shrnuje předchozí lekce.`
    : `${l.en} · ${l.vocab.length} slovíček · ${l.phrases.length} vazeb (Zapamatujte si)`;
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  };
});

/* cumulative pool for revision lessons: union of vocab/phrases from the preceding block of lessons */
function blockRangeFor(num){
  if(num === 10) return [1,9];
  if(num === 20) return [11,19];
  if(num === 30) return [21,29];
  return [num,num];
}
function vocabPoolFor(num){
  const l = LESSONS[num];
  if(!l.revision) return l.vocab.map(v=>({en:v.en,cz:v.cz,ipa:v.ipa}));
  const [a,b] = blockRangeFor(num);
  let pool = [];
  for(let n=a;n<=b;n++){ pool = pool.concat(LESSONS[n].vocab.map(v=>({en:v.en,cz:v.cz,ipa:v.ipa}))); }
  return pool;
}
function phrasePoolFor(num){
  const l = LESSONS[num];
  if(!l.revision) return l.phrases.slice();
  const [a,b] = blockRangeFor(num);
  let pool = [];
  for(let n=a;n<=b;n++){ pool = pool.concat(LESSONS[n].phrases); }
  return pool;
}

/* ============ GENERIC QUIZ ENGINE (used by Slovíčka + Vazby) ============ */
let quizSession = null;

function renderQuizSetup(kind){
  // kind: 'vocab' | 'phrases'
  const pool = kind === 'vocab' ? vocabPoolFor(currentLessonNum) : phrasePoolFor(currentLessonNum);
  const label = kind === 'vocab' ? 'slovíček' : 'vazeb';
  if(pool.length < 4){
    mainCard.innerHTML = `<h2 class="section-title">${kind==='vocab'?'Slovíčka':'Vazby'}</h2>
      <p class="empty-state">Pro tuto lekci není dost položek na kvíz (potřeba aspoň 4).</p>`;
    return;
  }
  mainCard.innerHTML = `
    <h2 class="section-title">${kind==='vocab'?'Zkoušení slovíček':'Zkoušení vazeb'}</h2>
    <p class="section-desc">${pool.length} ${label} k dispozici. Kolo: ${Math.min(15,pool.length)} otázek.</p>
    <div class="setup-row">
      <div class="toggle-group" id="dirToggle">
        <button data-dir="en2cz" class="on">EN → CZ</button>
        <button data-dir="cz2en">CZ → EN</button>
      </div>
    </div>
    <button class="primary" id="startBtn">Spustit kolo</button>
  `;
  let dir = 'en2cz';
  const toggle = document.getElementById('dirToggle');
  toggle.querySelectorAll('button').forEach(b=>{
    b.onclick = () => { toggle.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); dir = b.dataset.dir; };
  });
  document.getElementById('startBtn').onclick = () => startQuiz(kind, pool, dir);
}

function startQuiz(kind, pool, direction){
  const items = shuffle(pool).slice(0, Math.min(15, pool.length));
  quizSession = {kind, pool, direction, items, index:0, correct:0, missed:[], answered:false};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const s = quizSession;
  if(s.index >= s.items.length){ renderQuizSummary(); return; }
  const item = s.items[s.index];
  const isEn2Cz = s.direction === 'en2cz';
  const promptText = isEn2Cz ? item.en : primaryCz(item.cz);
  const correctAnswer = isEn2Cz ? item.cz : item.en;
  const others = shuffle(s.pool.filter(p => p.en !== item.en)).slice(0,3);
  const optionValues = shuffle([correctAnswer, ...others.map(o => isEn2Cz ? o.cz : o.en)]);

  mainCard.innerHTML = `
    <div class="quiz-progress"><span>Otázka ${s.index+1} / ${s.items.length}</span><span>Skóre: ${s.correct}</span></div>
    <div class="prompt-word">${promptText}</div>
    ${(isEn2Cz && item.ipa) ? `<div class="prompt-ipa">[${item.ipa}]</div>` : `<div class="prompt-ipa">&nbsp;</div>`}
    <div class="options" id="optsWrap"></div>
    <div class="feedback-row"><span class="feedback-text" id="fbText"></span><button class="primary" id="nextBtn" disabled>Další</button></div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  optionValues.forEach(val => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = val;
    b.onclick = () => handleQuizAnswer(val, correctAnswer, item);
    optsWrap.appendChild(b);
  });
}

function handleQuizAnswer(chosen, correctAnswer, item){
  if(quizSession.answered) return;
  quizSession.answered = true;
  const isRight = chosen === correctAnswer;
  const fb = document.getElementById('fbText');
  document.querySelectorAll('#optsWrap .opt-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === correctAnswer) b.classList.add('correct');
    else if(b.textContent === chosen) b.classList.add('wrong');
  });
  if(isRight){ quizSession.correct++; fb.textContent='Správně!'; fb.className='feedback-text correct'; }
  else { quizSession.missed.push(item); fb.textContent='Špatně – správně: '+correctAnswer; fb.className='feedback-text wrong'; }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').onclick = () => { quizSession.index++; quizSession.answered=false; renderQuizQuestion(); };
}

function renderQuizSummary(){
  const s = quizSession;
  const pct = Math.round((s.correct/s.items.length)*100);
  mainCard.innerHTML = `
    <h2 class="section-title">Výsledek kola</h2>
    <div class="summary-stats">
      <div class="stat"><span class="num">${s.correct}/${s.items.length}</span><span class="lbl">správně</span></div>
      <div class="stat"><span class="num">${pct}%</span><span class="lbl">úspěšnost</span></div>
    </div>
    ${s.missed.length ? `<p class="section-desc">K zopakování:</p><ul class="missed-list">${s.missed.map(m=>`<li><span class="en">${m.en}</span><span class="cz">${m.cz}</span></li>`).join('')}</ul>` : `<p class="section-desc">Bez chyby. 👍</p>`}
    <div class="setup-row">
      <button class="primary" id="retryBtn">${s.missed.length ? 'Zkusit znovu chybné' : 'Nové kolo'}</button>
      <button class="secondary" id="backBtn">Zpět</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = () => {
    if(s.missed.length){ quizSession = {kind:s.kind, pool:s.pool, direction:s.direction, items:shuffle(s.missed), index:0, correct:0, missed:[], answered:false}; renderQuizQuestion(); }
    else startQuiz(s.kind, s.pool, s.direction);
  };
  document.getElementById('backBtn').onclick = () => renderQuizSetup(s.kind);
}

/* ============ GRAMMAR TAB ============ */
function renderGrammar(){
  const l = LESSONS[currentLessonNum];
  if(l.revision){
    mainCard.innerHTML = `<h2 class="section-title">Gramatika</h2><p class="empty-state">Opakovací lekce nepřidává novou gramatiku – viz předchozí lekce.</p>`;
    return;
  }
  let html = `<h2 class="section-title">Gramatika – ${l.cz}</h2><div class="grammar-block">`;
  l.grammar.forEach(line => {
    const isHeading = line === line.toUpperCase() && /[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(line) && line.length < 60 && !line.startsWith('ƒ');
    if(isHeading) html += `<div class="topic-h">${line}</div>`;
    else html += `<p>${line}</p>`;
  });
  html += `</div>`;
  if(l.phrases && l.phrases.length){
    // phrases already shown in Vazby tab, skip duplicate here
  }
  if(l.ruzne && l.ruzne.length){
    html += `<h3 class="sub-title">Různé</h3><div class="grammar-block">`;
    l.ruzne.forEach(line => {
      const isHeading = line === line.toUpperCase() && /[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(line) && line.length < 60;
      if(isHeading) html += `<div class="topic-h">${line}</div>`;
      else html += `<p>${line}</p>`;
    });
    html += `</div>`;
  }
  mainCard.innerHTML = html;
}

/* ============ TEST TAB ============ */
let testSession = null;

function buildTestQuestions(){
  const vpool = vocabPoolFor(currentLessonNum);
  const ppool = phrasePoolFor(currentLessonNum);
  const vocabQs = shuffle(vpool).slice(0, Math.min(10, vpool.length)).map(item => {
    const isEn2Cz = Math.random() > 0.5;
    const correctAnswer = isEn2Cz ? item.cz : item.en;
    const others = shuffle(vpool.filter(p => p.en !== item.en)).slice(0,3);
    const optionValues = shuffle([correctAnswer, ...others.map(o => isEn2Cz ? o.cz : o.en)]);
    return {prompt: isEn2Cz ? item.en : primaryCz(item.cz), ipa: isEn2Cz ? item.ipa : null, options: optionValues, correct: correctAnswer};
  });
  const phraseQs = shuffle(ppool).slice(0, Math.min(5, ppool.length)).map(item => {
    const isEn2Cz = Math.random() > 0.5;
    const correctAnswer = isEn2Cz ? item.cz : item.en;
    const others = shuffle(ppool.filter(p => p.en !== item.en)).slice(0,3);
    const optionValues = shuffle([correctAnswer, ...others.map(o => isEn2Cz ? o.cz : o.en)]);
    return {prompt: isEn2Cz ? item.en : item.cz, ipa: null, options: optionValues, correct: correctAnswer};
  });
  return shuffle([...vocabQs, ...phraseQs]);
}

function renderTest(){
  const l = LESSONS[currentLessonNum];
  if(l.revision){ renderRevisionTest(); return; }
  mainCard.innerHTML = `
    <h2 class="section-title">Test – ${l.cz}</h2>
    <p class="section-desc">Kombinovaný test ze slovíček a vazeb této lekce. Vygenerovaný automaticky, ne z originálních cvičení knihy.</p>
    <button class="primary" id="startTestBtn">Spustit test</button>
    <div id="historyBox" style="margin-top:22px;"></div>
  `;
  document.getElementById('startTestBtn').onclick = () => {
    const items = buildTestQuestions();
    if(items.length < 3){ return; }
    testSession = {items, index:0, correct:0, wrong:[], answered:false};
    renderTestQuestion();
  };
  renderTestHistory();
}

async function renderTestHistory(){
  const hist = await loadTestHistory(currentLessonNum);
  const box = document.getElementById('historyBox');
  if(!box) return;
  if(!_userDocRef){ box.innerHTML = `<p class="section-desc">Historie testů se v tomto zobrazení neukládá.</p>`; return; }
  if(!hist.length){ box.innerHTML = `<p class="section-desc">Zatím žádná historie testů pro tuto lekci.</p>`; return; }
  box.innerHTML = `<h3 class="sub-title">Historie</h3><ul class="history-list">${hist.slice().reverse().slice(0,8).map(h=>{
    const pct = Math.round((h.score/h.total)*100);
    return `<li><span>${h.date}</span><span class="${pct>=70?'score-good':'score-bad'}">${h.score}/${h.total} (${pct}%)</span></li>`;
  }).join('')}</ul>`;
}

function renderTestQuestion(){
  const s = testSession;
  if(s.index >= s.items.length){ finishTest(); return; }
  const q = s.items[s.index];
  mainCard.innerHTML = `
    <div class="quiz-progress"><span>Otázka ${s.index+1} / ${s.items.length}</span><span>Skóre: ${s.correct}</span></div>
    <div class="prompt-word" style="font-size:22px;">${q.prompt}</div>
    ${q.ipa ? `<div class="prompt-ipa">[${q.ipa}]</div>` : `<div class="prompt-ipa">&nbsp;</div>`}
    <div class="options" id="optsWrap"></div>
    <div class="feedback-row"><span class="feedback-text" id="fbText"></span><button class="primary" id="nextBtn" disabled>Další</button></div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  q.options.forEach(val => {
    const b = document.createElement('button'); b.className='opt-btn'; b.textContent=val;
    b.onclick = () => handleTestAnswer(val, q);
    optsWrap.appendChild(b);
  });
}

function handleTestAnswer(chosen, q){
  if(testSession.answered) return;
  testSession.answered = true;
  const isRight = chosen === q.correct;
  const fb = document.getElementById('fbText');
  document.querySelectorAll('#optsWrap .opt-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === q.correct) b.classList.add('correct');
    else if(b.textContent === chosen) b.classList.add('wrong');
  });
  if(isRight){ testSession.correct++; fb.textContent='Správně!'; fb.className='feedback-text correct'; }
  else { testSession.wrong.push(q); fb.textContent='Špatně – správně: '+q.correct; fb.className='feedback-text wrong'; }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').onclick = () => { testSession.index++; testSession.answered=false; renderTestQuestion(); };
}

async function finishTest(){
  const s = testSession;
  await appendTestHistory(currentLessonNum, {date: new Date().toLocaleDateString('cs-CZ'), score:s.correct, total:s.items.length});
  const pct = Math.round((s.correct/s.items.length)*100);
  mainCard.innerHTML = `
    <h2 class="section-title">Výsledek testu</h2>
    <div class="summary-stats">
      <div class="stat"><span class="num">${s.correct}/${s.items.length}</span><span class="lbl">správně</span></div>
      <div class="stat"><span class="num">${pct}%</span><span class="lbl">úspěšnost</span></div>
    </div>
    ${s.wrong.length ? `<p class="section-desc">Chyby:</p><ul class="missed-list">${s.wrong.map(w=>`<li><span class="en">${w.prompt}</span><span class="cz">${w.correct}</span></li>`).join('')}</ul>` : `<p class="section-desc">Bez chyby. 👍</p>`}
    <button class="primary" id="backBtn">Zpět</button>
  `;
  document.getElementById('backBtn').onclick = renderTest;
}

/* ============ REVISION TEST (real book exercises, zadání/řešení) ============ */
function renderRevisionTest(){
  const l = LESSONS[currentLessonNum];
  const rd = l.revisionData || {assignments:[], answers:[]};
  let html = `<h2 class="section-title">Test – ${l.cz}</h2>
    <p class="section-desc">Skutečná cvičení z knihy pro tuto opakovací lekci. Vyplň si odpovědi na papír nebo v hlavě, pak si klikni na řešení.</p>`;
  rd.assignments.forEach((a, idx) => {
    const answer = rd.answers[idx];
    html += `<div class="revision-block">
      <h4>Cvičení ${idx+1}: ${a.instr}</h4>
      <pre>${a.body.join('\n')}</pre>
      ${answer ? `<button class="secondary reveal-btn" data-idx="${idx}">Zobrazit řešení</button>
      <div class="answer-box" id="ans-${idx}"><pre>${answer.body.join('\n')}</pre></div>` : ''}
    </div>`;
  });
  mainCard.innerHTML = html;
  mainCard.querySelectorAll('.reveal-btn').forEach(btn=>{
    btn.onclick = () => {
      document.getElementById('ans-'+btn.dataset.idx).classList.toggle('show');
    };
  });
}

/* ============ ZAPAMATUJTE SI TAB ============ */
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let zapHideCz = false;
function zapListHtml(items){
  return `<ul class="zap-list${zapHideCz?' hide-cz':''}">${items.map(p=>`<li><span class="en">${esc(p.en)}</span><span class="cz">${esc(p.cz)}</span></li>`).join('')}</ul>`;
}
function renderZap(){
  const l = LESSONS[currentLessonNum];
  let body = '', count = 0;
  if(l.revision){
    const [a,b] = blockRangeFor(currentLessonNum);
    for(let n=a;n<=b;n++){
      const ph = LESSONS[n].phrases || [];
      if(!ph.length) continue;
      count += ph.length;
      body += `<div class="zap-group-h">Lekce ${n} – ${esc(LESSONS[n].cz)}</div>` + zapListHtml(ph);
    }
  } else {
    count = l.phrases.length;
    body = zapListHtml(l.phrases);
  }
  mainCard.innerHTML = `
    <h2 class="section-title">Zapamatujte si – ${esc(l.cz)}</h2>
    <p class="section-desc">${l.revision ? `Opakovací lekce nemá vlastní oddíl – níže jsou oddíly lekcí ${blockRangeFor(currentLessonNum).join('–')} (${count} vazeb).` : `${count} vazeb z rámečku „Zapamatujte si“ této lekce.`} S vypnutou češtinou klepni na skrytý překlad, zobrazí se.</p>
    <div class="zap-tools">
      <div class="toggle-group" id="czToggle">
        <button data-v="0" class="${zapHideCz?'':'on'}">Čeština viditelná</button>
        <button data-v="1" class="${zapHideCz?'on':''}">Skrýt češtinu</button>
      </div>
    </div>
    ${count ? body : '<p class="empty-state">Tato lekce nemá oddíl Zapamatujte si.</p>'}`;
  document.querySelectorAll('#czToggle button').forEach(b=>{
    b.onclick = () => { zapHideCz = b.dataset.v === '1'; renderZap(); };
  });
  mainCard.querySelectorAll('.zap-list .cz').forEach(c=>{
    c.onclick = () => { if(zapHideCz) c.classList.toggle('shown'); };
  });
}

/* ============ FRÁZOVÁ SLOVESA (mimo lekce) ============ */
const FV_SET_SIZE = 10;
const fvLabel = it => `${it.v} ${it.p}`;
const FV_SETS = (()=>{ const s=[]; for(let i=0;i<PHRASAL.length;i+=FV_SET_SIZE) s.push(PHRASAL.slice(i,i+FV_SET_SIZE)); return s; })();
const FV_PARTICLES = [...new Set(PHRASAL.flatMap(it=>[it.p, ...it.ex.map(e=>e.blank)]))].filter(p=>!/somebody|^(lost|mad)$/.test(p));
let fvTab = 'tests';
let fvSession = null;

function renderFvChrome(inner){
  mainCard.innerHTML = `
    <nav class="tabs" style="background:#e9e1c9;margin:-6px -6px 16px;">
      <button data-fv="tests" class="${fvTab==='tests'?'active':''}" style="color:var(--ink)">Testy po ${FV_SET_SIZE}</button>
      <button data-fv="list" class="${fvTab==='list'?'active':''}" style="color:var(--ink)">Přehled</button>
    </nav>${inner}`;
  mainCard.querySelectorAll('[data-fv]').forEach(b=>{ b.onclick = () => { fvTab = b.dataset.fv; renderFv(); }; });
}

function renderFv(){
  if(fvTab === 'list') renderFvList(); else renderFvSets();
}

function renderFvList(){
  let html = `<h2 class="section-title">Frázová slovesa – přehled</h2>
    <p class="section-desc">${PHRASAL.length} vazeb: jádro je z oddílu „Frázová slovesa“ v lekci 27 (s. 192–194), doplněné o frázová slovesa z rámečků Zapamatujte si v ostatních lekcích.</p>
    <div class="zap-tools"><div class="toggle-group" id="czToggle">
      <button data-v="0" class="${zapHideCz?'':'on'}">Čeština viditelná</button>
      <button data-v="1" class="${zapHideCz?'on':''}">Skrýt češtinu</button></div></div>`;
  const byVerb = {};
  PHRASAL.forEach(it => { (byVerb[it.v] = byVerb[it.v] || []).push(it); });
  Object.keys(byVerb).sort().forEach(v => {
    html += `<div class="fv-verb">${v.toUpperCase()}</div><ul class="zap-list${zapHideCz?' hide-cz':''}">`;
    byVerb[v].forEach(it => {
      const ex = it.ex[0];
      html += `<li><span class="en">${esc(fvLabel(it))} <span class="fv-src">· ${esc(it.src)}</span>${ex && ex.en.split(' ').length>3 ? `<span class="fv-ex">${esc(ex.en)}</span>` : ''}</span><span class="cz">${esc(it.cz)}</span></li>`;
    });
    html += `</ul>`;
  });
  renderFvChrome(html);
  document.querySelectorAll('#czToggle button').forEach(b=>{ b.onclick = () => { zapHideCz = b.dataset.v === '1'; renderFvList(); }; });
  mainCard.querySelectorAll('.zap-list .cz').forEach(c=>{ c.onclick = () => { if(zapHideCz) c.classList.toggle('shown'); }; });
}

async function renderFvSets(){
  renderFvChrome(`
    <h2 class="section-title">Testy frázových sloves</h2>
    <p class="section-desc">Každý test má ${FV_SET_SIZE} vazeb. Otázky se střídají: význam EN → CZ, CZ → EN a doplnění částice do věty z knihy.</p>
    <div class="set-grid" id="setGrid"></div>
    <button class="secondary" id="mixBtn">Náhodný mix ${FV_SET_SIZE} ze všech</button>
    <div id="historyBox" style="margin-top:22px;"></div>`);
  document.getElementById('mixBtn').onclick = () => startFvTest('mix', shuffle(PHRASAL).slice(0, FV_SET_SIZE));
  const state = await loadState();
  const th = state.testHistory || {};
  const grid = document.getElementById('setGrid');
  if(!grid) return;
  FV_SETS.forEach((set, i) => {
    const key = 'fv-' + (i+1);
    const h = th[key] || [];
    const best = h.length ? Math.max(...h.map(x=>Math.round(x.score/x.total*100))) : null;
    const verbs = [...new Set(set.map(it=>it.v))].join(', ');
    const b = document.createElement('button');
    b.className = 'set-btn';
    b.innerHTML = `<b>Test ${i+1}</b><small>${set.length} vazeb · ${esc(verbs)}</small>${best!==null ? `<span class="best" style="color:${best>=70?'var(--good)':'var(--bad)'}">nejlépe ${best} %</span>` : ''}`;
    b.onclick = () => startFvTest(key, set);
    grid.appendChild(b);
  });
  const box = document.getElementById('historyBox');
  if(!_userDocRef){ box.innerHTML = `<p class="section-desc">Historie testů se v tomto zobrazení neukládá.</p>`; return; }
  const all = Object.keys(th).filter(k=>k.startsWith('fv-')||k==='fv-mix').flatMap(k=>th[k].map(x=>({...x,k})));
  if(!all.length){ box.innerHTML = `<p class="section-desc">Zatím žádná historie testů frázových sloves.</p>`; return; }
  box.innerHTML = `<h3 class="sub-title">Historie</h3><ul class="history-list">${all.slice(-8).reverse().map(h=>{
    const pct = Math.round(h.score/h.total*100);
    const name = h.k==='fv-mix' ? 'Mix' : 'Test '+h.k.slice(3);
    return `<li><span>${h.date} · ${name}</span><span class="${pct>=70?'score-good':'score-bad'}">${h.score}/${h.total} (${pct}%)</span></li>`;
  }).join('')}</ul>`;
}

function pickDistractors(item, n, valueFn){
  const correct = valueFn(item);
  const same = shuffle(PHRASAL.filter(o => o !== item && o.v === item.v));
  const rest = shuffle(PHRASAL.filter(o => o !== item && o.v !== item.v));
  const out = [];
  for(const o of [...same, ...rest]){
    const v = valueFn(o);
    if(v !== correct && !out.includes(v)) out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function buildFvQuestion(item){
  const kinds = ['en2cz','cz2en'];
  if(item.ex.length) kinds.push('gap','gap');
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  if(kind === 'en2cz'){
    const correct = item.cz;
    return {kind, label:'Co znamená?', prompt: esc(fvLabel(item)), options: shuffle([correct, ...pickDistractors(item,3,o=>o.cz)]), correct, item};
  }
  if(kind === 'cz2en'){
    const correct = fvLabel(item);
    return {kind, label:'Jak se řekne anglicky?', prompt: esc(item.cz), options: shuffle([correct, ...pickDistractors(item,3,fvLabel)]), correct, item};
  }
  const ex = item.ex[Math.floor(Math.random()*item.ex.length)];
  const re = new RegExp('\\b' + ex.blank.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b(?![\\s\\S]*\\b' + ex.blank.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b)');
  const sentence = esc(ex.en).replace(re, '<span class="gap">&nbsp;</span>');
  const others = shuffle(FV_PARTICLES.filter(p => p !== ex.blank)).slice(0,3);
  return {kind, label:'Doplň částici', prompt:`<div class="gap-sentence">${sentence}</div><div class="prompt-ipa" style="font-family:var(--sans);font-style:italic">${esc(ex.cz)}</div>`, options: shuffle([ex.blank, ...others]), correct: ex.blank, item};
}

function startFvTest(key, set){
  fvSession = {key, items: shuffle(set).map(buildFvQuestion), index:0, correct:0, wrong:[], answered:false};
  renderFvQuestion();
}

function renderFvQuestion(){
  const s = fvSession;
  if(s.index >= s.items.length){ finishFvTest(); return; }
  const q = s.items[s.index];
  mainCard.innerHTML = `
    <div class="quiz-progress"><span>${s.key==='fv-mix'?'Mix':'Test '+s.key.slice(3)} · otázka ${s.index+1} / ${s.items.length}</span><span>Skóre: ${s.correct}</span></div>
    <div class="q-kind">${q.label}</div>
    ${q.kind==='gap' ? q.prompt : `<div class="prompt-word" style="font-size:24px;">${q.prompt}</div><div class="prompt-ipa">&nbsp;</div>`}
    <div class="options" id="optsWrap"></div>
    <div class="feedback-row"><span class="feedback-text" id="fbText"></span><button class="primary" id="nextBtn" disabled>Další</button></div>`;
  const wrap = document.getElementById('optsWrap');
  q.options.forEach(val => {
    const b = document.createElement('button'); b.className='opt-btn'; b.textContent = val;
    b.onclick = () => {
      if(s.answered) return; s.answered = true;
      const ok = val === q.correct;
      wrap.querySelectorAll('.opt-btn').forEach(x=>{ x.disabled=true; if(x.textContent===q.correct) x.classList.add('correct'); else if(x.textContent===val) x.classList.add('wrong'); });
      const fb = document.getElementById('fbText');
      if(ok){ s.correct++; fb.textContent='Správně! ' + fvLabel(q.item) + ' = ' + q.item.cz; fb.className='feedback-text correct'; }
      else { s.wrong.push(q.item); fb.textContent='Špatně – ' + fvLabel(q.item) + ' = ' + q.item.cz; fb.className='feedback-text wrong'; }
      const nb = document.getElementById('nextBtn'); nb.disabled=false;
      nb.onclick = () => { s.index++; s.answered=false; renderFvQuestion(); };
    };
    wrap.appendChild(b);
  });
}

async function finishFvTest(){
  const s = fvSession;
  const pct = Math.round(s.correct/s.items.length*100);
  mainCard.innerHTML = `
    <h2 class="section-title">Výsledek – ${s.key==='fv-mix'?'mix':'test '+s.key.slice(3)}</h2>
    <div class="summary-stats">
      <div class="stat"><span class="num">${s.correct}/${s.items.length}</span><span class="lbl">správně</span></div>
      <div class="stat"><span class="num">${pct}%</span><span class="lbl">úspěšnost</span></div>
    </div>
    ${s.wrong.length ? `<p class="section-desc">K zopakování:</p><ul class="missed-list">${s.wrong.map(w=>`<li><span class="en">${esc(fvLabel(w))}</span><span class="cz">${esc(w.cz)}</span></li>`).join('')}</ul>` : `<p class="section-desc">Bez chyby.</p>`}
    <div class="setup-row">
      ${s.wrong.length ? `<button class="primary" id="retryBtn">Zkusit znovu chybné</button>` : ''}
      <button class="secondary" id="backBtn">Zpět na testy</button>
    </div>`;
  if(s.wrong.length) document.getElementById('retryBtn').onclick = () => {
    fvSession = {key:s.key, items: shuffle(s.wrong).map(buildFvQuestion), index:0, correct:0, wrong:[], answered:false, retry:true};
    renderFvQuestion();
  };
  document.getElementById('backBtn').onclick = renderFvSets;
  if(!s.retry) await appendTestHistory(s.key, {date: new Date().toLocaleDateString('cs-CZ'), score:s.correct, total:s.items.length});
}

/* ============ MODE SWITCH ============ */
let appMode = 'lessons';
document.querySelectorAll('#modeSwitch button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('#modeSwitch button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    appMode = b.dataset.mode;
    document.getElementById('lessonChrome').style.display = appMode === 'lessons' ? '' : 'none';
    render();
  };
});

/* ============ MAIN RENDER ============ */
function render(){
  if(appMode === 'fv'){ renderFv(); return; }
  if(activeTab === 'vocab') renderQuizSetup('vocab');
  else if(activeTab === 'zap') renderZap();
  else if(activeTab === 'phrases') renderQuizSetup('phrases');
  else if(activeTab === 'grammar') renderGrammar();
  else if(activeTab === 'test') renderTest();
}

populateLessonSelect();
updateMeta();
render();
</script>
